# mtls-agent の設定例 / Example configuration for mtls-agent
#
# このファイルを /etc/mtls-agent/config.yaml などリポジトリの外へコピーして編集する。
# Copy this file outside the repository (e.g. /etc/mtls-agent/config.yaml) and edit it.

# ACME ディレクトリの URL / ACME directory URL
ca_url: "https://ca.internal.example.com:8443/acme/directory"

# ルート CA の証明書（安全な経路で配っておく）/ Root CA certificate (distribute out of band)
ca_root: "/etc/mtls-agent/root.crt"

# ACME アカウントの鍵（無ければ初回に作る）/ ACME account key (created on first run)
account_key: "/var/lib/mtls-agent/account.key"

# 初回の登録に使う EAB（mtlsctl eab create の出力）/ EAB for the first registration
eab:
  kid: "REPLACE_WITH_KID"
  # HMAC 鍵のファイル（0600）。環境変数 MTLS_AGENT_EAB_HMAC でも渡せる。
  # HMAC key file (0600). Can also be given via MTLS_AGENT_EAB_HMAC.
  hmac_file: "/etc/mtls-agent/eab.hmac"

# 証明書に載せる名前 / Names on the certificate
names:
  - "web1.internal.example.com"

# 鍵の種類 / Key type: ecdsa-p256 (default), ecdsa-p384, rsa-2048, rsa-3072, rsa-4096, ed25519
key_type: "ecdsa-p256"

challenge:
  # http-01（既定）または tls-alpn-01 / http-01 (default) or tls-alpn-01
  type: "http-01"
  # 所有確認の間だけ開くアドレス / Address opened only during validation
  listen: ":80"
  # 既存の Web サーバで 80 番を使っている場合は、公開ディレクトリを指定する
  # If a web server already uses port 80, point to its document root instead
  # webroot: "/var/www/html"

output:
  cert: "/etc/mtls-agent/tls/cert.pem"           # 末端の証明書 / leaf only
  chain: "/etc/mtls-agent/tls/chain.pem"         # 中間 CA / intermediate
  fullchain: "/etc/mtls-agent/tls/fullchain.pem" # 末端 + 中間 CA / leaf + intermediate
  key: "/etc/mtls-agent/tls/key.pem"             # 秘密鍵 / private key
  ca: "/etc/mtls-agent/tls/ca.pem"               # ルート CA の写し / copy of root CA
  # 0600（既定）または 0640（同じグループのアプリに読ませる）/ 0600 (default) or 0640
  key_mode: "0600"

renew:
  # 有効期間のこの割合が過ぎたら更新（0.66 = 残り 1/3）/ Renew after this fraction of lifetime
  fraction: 0.66
  check_interval: "1m"
  timeout: "5m"

hooks:
  # 更新後に実行するコマンド（シェルを介さない）/ Command run after renewal (no shell)
  # post_renew: ["systemctl", "reload", "nginx"]
  timeout: "60s"

log:
  level: "info"
  format: "text"
