# server-b の nginx。mTLS で待ち受け、接続を許可する相手は server-a だけにする。
#   - クライアント証明書を必須にし、この CA のルート（ca.pem）で検証する
#   - 検証を通った相手の名前（CN）が server-a.playground.internal でなければ 403
map $ssl_client_s_dn $mtls_allowed {
    default                                      0;
    "~CN=server-a\.playground\.internal(,|$)"    1;
}

server {
    listen 8443 ssl;
    server_name server-b.playground.internal;

    ssl_certificate         /etc/mtls-agent/tls/fullchain.pem;
    ssl_certificate_key     /etc/mtls-agent/tls/key.pem;
    ssl_client_certificate  /etc/mtls-agent/tls/ca.pem;
    ssl_verify_client       on;
    ssl_verify_depth        2;
    ssl_protocols           TLSv1.2 TLSv1.3;

    location = /hello {
        if ($mtls_allowed = 0) { return 403 "forbidden: $ssl_client_s_dn is not allowed\n"; }
        default_type text/plain;
        return 200 "hello from server-b (nginx), client=$ssl_client_s_dn\n";
    }

    location / {
        return 404;
    }
}
