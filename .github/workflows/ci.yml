name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 書式・静的解析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./... && go vet -tags interop ./test/...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  test:
    name: テスト (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go: oldstable }
          - { os: ubuntu-latest, go: stable }
          - { os: macos-latest, go: stable }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -count=1 ./...

  interop:
    name: 相互接続試験（lego）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: lego をインストール
        run: go install github.com/go-acme/lego/v4/cmd/lego@v4.35.2
      - name: 試験用のホスト名を 127.0.0.1 に向ける
        run: echo "127.0.0.1 ca.internal.example.com web1.internal.example.com" | sudo tee -a /etc/hosts
      - run: go test -tags interop -count=1 -v ./test/interop/
        env:
          LEGO_BIN: /home/runner/go/bin/lego

  build:
    name: ビルド (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build -trimpath -o dist/ ./cmd/...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"

  vuln:
    name: 既知の脆弱性（govulncheck）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  secrets:
    name: 秘密情報の混入検査（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: 全履歴を検査
        run: gitleaks git --redact --verbose .
